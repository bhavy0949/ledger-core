apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-deployment
  labels:
    app: ledger-core
    tier: worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-core
      tier: worker
  template:
    metadata:
      labels:
        app: ledger-core
        tier: worker
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: worker-container
          image: <ecr-url>/ledger-worker:latest
          envFrom:
            - secretRef:
                name: ledger-secrets
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
