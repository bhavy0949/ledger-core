apiVersion: v1
kind: Secret
metadata:
  name: ledger-secrets
type: Opaque
stringData:
  DJANGO_ENV: prod
  DJANGO_SECRET_KEY: <base64-encoded-secret>
  DJANGO_ALLOWED_HOSTS: "*"
  DJANGO_LOG_LEVEL: INFO
  DB_NAME: ledger
  DB_USER: ledger
  DB_PASSWORD: <base64-encoded-password>
  DB_HOST: <rds-endpoint>
  DB_PORT: "5432"
  REDIS_URL: redis://<redis-endpoint>:6379/0
  JWT_PUBLIC_KEY_PATH: /etc/keys/public.pem
  JWT_ISSUER: ledger-core
  CORS_ALLOWED_ORIGINS: https://<domain>
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-keys
type: Opaque
stringData:
  public.pem: <base64-encoded-public-key>
