apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-deployment
  labels:
    app: ledger-core
    tier: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-core
      tier: api
  template:
    metadata:
      labels:
        app: ledger-core
        tier: api
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api-container
          image: <ecr-url>/ledger-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: ledger-secrets
          livenessProbe:
            httpGet:
              path: /admin/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /admin/
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          volumeMounts:
            - name: jwt-keys
              mountPath: /etc/keys
              readOnly: true
      initContainers:
        - name: migrate
          image: <ecr-url>/ledger-api:latest
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - secretRef:
                name: ledger-secrets
      volumes:
        - name: jwt-keys
          secret:
            secretName: jwt-keys
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
spec:
  selector:
    app: ledger-core
    tier: api
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
